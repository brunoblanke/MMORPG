<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spell simulator</title>
  <link rel="stylesheet" href="css/spell-simulator.css" />
</head>
<body>
  <form id="simForm" autocomplete="off">
    <div class="sim-who">
      <button type="button" tabindex="-1" data-who="creature">Creature</button>
      <button type="button" tabindex="-1" data-who="player">Player</button>
    </div>
    <div id="simFields" class="sim-fields"></div>
    <button type="button" tabindex="-1" id="simCast">Cast</button>
  </form>
  <canvas id="simCanvas"></canvas>
  <script type="module" src="js/views/spell-simulator.js"></script>
</body>
</html>
