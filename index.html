<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo 2D</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="nameModal" class="modal">
    <form id="nameForm" class="modal-box" autocomplete="off">
      <h1>Escolha o nome do personagem</h1>
      <div class="gender-picker" role="radiogroup" aria-label="Gênero do personagem">
        <button type="button" class="gender-option" data-gender="male" role="radio" aria-label="Masculino" title="Masculino">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="m21 3-6.75 6.75"/><circle cx="10" cy="14" r="6"/></svg>
        </button>
        <button type="button" class="gender-option" data-gender="female" role="radio" aria-label="Feminino" title="Feminino">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15v7"/><path d="M9 19h6"/><circle cx="12" cy="9" r="6"/></svg>
        </button>
      </div>
      <input id="nameInput" type="text" placeholder="Nome do personagem" spellcheck="false" autofocus>
      <p id="nameError" class="modal-error" role="alert"></p>
      <button type="submit">Entrar</button>
    </form>
  </div>
  
  <script type="importmap">
  {
    "imports": {
      "./js/": "./js/"
    }
  }
  </script>
  
  <script type="module">
    import { GameController } from './js/game.js';
    window.game = new GameController();
  </script>
</body>
</html>
