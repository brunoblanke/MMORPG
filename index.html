<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo 2D</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="nameModal" class="modal">
    <form id="nameForm" class="modal-box" autocomplete="off">
      <h1>Escolha o nome do personagem</h1>
      <input id="nameInput" type="text" placeholder="Nome do personagem" spellcheck="false" autofocus>
      <p id="nameError" class="modal-error" role="alert"></p>
      <button type="submit">Entrar</button>
    </form>
  </div>
  
  <script type="importmap">
  {
    "imports": {
      "./js/": "./js/"
    }
  }
  </script>
  
  <script type="module">
    import { GameController } from './js/game.js';
    window.game = new GameController();
  </script>
</body>
</html>
