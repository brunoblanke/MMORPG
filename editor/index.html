<!-- index.html -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Editor de mapa</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <div class="side-col">
    <div class="ed-win">
      <div class="ed-head"><span class="ed-title">Editor de mapa</span></div>
      <div class="ed-body">
        <div class="tools" id="tools"></div>
      </div>
    </div>

  </div>

  <div class="main stats-hidden">
    <div class="quickbar" id="quickbar">
      <div class="layer-tabs" id="layerTabs"></div>
      <div class="quick-sep"></div>
      <div class="quick-tools" id="quickTools"></div>
      <div class="quick-sep"></div>
      <input class="goto-input" id="gotoInput" placeholder="x, y, z" title="Vai pro sqm (Enter): x, y, z" autocomplete="off" />
    </div>

    <div class="quickbar bottombar">
      <label class="checkline" title="Mostra o andar de baixo esmaecido">
        <input type="checkbox" id="ghostToggle" />
        Andares
      </label>
      <div class="quick-sep"></div>
      <label class="checkline" title="Mostra as bordas dos pisos e as animações">
        <input type="checkbox" id="detailsToggle" />
        Detalhes
      </label>
      <div class="quick-sep"></div>
      <label class="checkline" title="Mostra a barra de contagem (piso, borda, parede…) na base da tela">
        <input type="checkbox" id="statsToggle" />
        Stats
      </label>
      <div class="quick-sep"></div>
      <a class="export-btn secondary" id="simulatorBtn" href="../simulador.html" target="_blank" title="Play as a level 100 player and test every creature spell, spell, rune, ammunition and wand on training dummies">Simulator</a>
      <a class="export-btn secondary" id="spellsBtn" href="magias.html" target="_blank" title="Shows every spell shape and the player spells, runes and wands">Spells</a>
      <button class="export-btn secondary" id="testPlayersBtn" title="Cria no servidor o Druid, Paladin, Knight e Sorcerer (nível 100, skills 100, senha 123456), com armas, munição e runas">Players de teste</button>
      <a class="export-btn secondary" id="downloadBtn" href="../api/map?baixar=1" download="map.json" title="Baixa o mapa do servidor (pra guardar no git)">Baixar</a>
      <button class="export-btn" id="saveBtn" title="Salva o mapa no servidor (Ctrl+S)">Salvar</button>
    </div>

    <div class="canvas-wrap">
      <div class="board">
        <canvas id="canvas" width="800" height="800"></canvas>
      </div>
    </div>

    <div class="statusbar" id="statusbar" hidden>
      <span>Editando <b id="layerLabel">Andar 0</b></span>
      <div class="status-list">
        <div>Piso: <b id="statFloor">0</b></div>
        <div>Borda: <b id="statBorder">0</b></div>
        <div>Parede: <b id="statWall">0</b></div>
        <div>Escada: <b id="statStairs">0</b></div>
        <div>Buraco: <b id="statHole">0</b></div>
        <div>Item: <b id="statItem">0</b></div>
        <div>Criatura: <b id="statCreature">0</b></div>
        <div>Zona segura: <b id="statSafe">0</b></div>
      </div>
    </div>
  </div>

</div>

<div class="float-panel" id="enemyForm">
  <div class="field">
    <label id="enemyName">Criatura</label>
  </div>
  <div class="row">
    <div class="field">
      <label>Level</label>
      <input type="number" id="enemyLvl" value="5" min="1" />
    </div>
  </div>
  <div class="actions">
    <button id="enemyCancel">Cancelar</button>
    <button class="primary" id="enemyConfirm">Colocar criatura</button>
  </div>
</div>


<div class="float-panel wide" id="selectPanel">
  <div class="field">
    <label id="selectTitle">Sqm</label>
  </div>
  <div id="selectList" class="select-list"></div>
  <div class="actions">
    <button id="selectClose">Fechar</button>
  </div>
</div>

<div class="float-panel wide" id="objectDataForm">
  <div class="field">
    <label id="objectDataTitle">Objeto</label>
  </div>
  <div class="field" id="objectDataTextField">
    <label for="objectDataText">Texto</label>
    <textarea id="objectDataText" rows="6" maxlength="2000"></textarea>
  </div>
  <div class="field" id="objectDataColorField">
    <label for="objectDataColor">Cor da mensagem</label>
    <select id="objectDataColor">
      <option value="info">Verde</option>
      <option value="warn">Amarelo</option>
      <option value="danger">Vermelho</option>
      <option value="blue">Azul</option>
    </select>
  </div>
  <div class="field" id="objectDataItemsField">
    <label id="objectDataItemsLabel">Itens do baú (cada player pega uma vez)</label>
    <div id="objectDataItems" class="object-data-items"></div>
    <button type="button" id="objectDataAddItem">+ Item</button>
  </div>
  <div class="actions">
    <button id="objectDataCancel">Cancelar</button>
    <button class="primary" id="objectDataConfirm">Salvar</button>
  </div>
</div>

<script type="module" src="js/controller/app.js"></script>

</body>
</html>
