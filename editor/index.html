<!-- index.html -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Editor de mapa</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <div class="side-col">
    <div class="tools" id="tools"></div>
  </div>

  <div class="main stats-hidden">
    <div class="quickbar" id="quickbar">
      <div class="layer-dropdown" id="layerSelect" title="Andar que está editando"></div>
      <div class="quick-sep"></div>
      <div class="quick-tools" id="quickTools"></div>
      <div class="quick-sep"></div>
      <div class="quick-btn zoom-btn" id="zoomReset" title="Zoom do mapa (roda do mouse); clique volta pra 100%">100%</div>
      <div class="quick-sep"></div>
      <input class="goto-input" id="gotoInput" placeholder="x, y, z" title="Vai pro sqm (Enter): x, y, z" autocomplete="off" />
    </div>

    <div class="bottom-dock">
    <div class="fullscreen-bar">
      <button class="fullscreen-btn" id="fullscreenBtn" type="button" title="Tela cheia" aria-label="Tela cheia" hidden>
        <svg class="fs-enter" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <svg class="fs-exit" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
      </button>
    </div>

    <div class="quickbar bottombar">
      <label class="icon-toggle" title="Andares: mostra o andar de baixo esmaecido">
        <input type="checkbox" id="ghostToggle" aria-label="Andares" />
        <svg width="16" height="16" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.5 20 7.5 11 12.5 2 7.5Z"/><path d="M2 11.5l9 5 9-5"/><path d="M2 15.5l9 5 9-5"/></svg>
      </label>
      <label class="icon-toggle" title="Detalhes: mostra as bordas dos pisos e as animações">
        <input type="checkbox" id="detailsToggle" aria-label="Detalhes" />
        <svg width="16" height="16" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5 10.6 7.4 15.5 9 10.6 10.6 9 15.5 7.4 10.6 2.5 9 7.4 7.4Z"/><path d="M16.5 13.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8Z"/></svg>
      </label>
      <label class="icon-toggle" title="Stats: mostra a barra de contagem (piso, borda, parede…) na base da tela">
        <input type="checkbox" id="statsToggle" aria-label="Stats" />
        <svg width="16" height="16" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2.5v16.5h16.5"/><path d="M5.5 14c2-6 3.8-6 5.5-2s3.5 4 7-6"/></svg>
      </label>
      <div class="quick-sep"></div>
      <div class="extras" id="extras">
        <button class="export-btn secondary" id="extrasBtn" type="button" aria-haspopup="true" aria-expanded="false">Extras ▴</button>
        <div class="extras-menu" id="extrasMenu" hidden>
          <a class="export-btn secondary" id="simulatorBtn" href="../simulador.html" target="_blank" title="Play as a level 100 player and test every creature spell, spell, rune, ammunition and wand on training dummies">Simulator</a>
          <button class="export-btn secondary" id="testPlayersBtn" title="Cria no servidor o Druid, Paladin, Knight e Sorcerer (nível 100, skills 100, senha 123456), com armas, munição e runas">Players de teste</button>
          <a class="export-btn secondary" id="downloadBtn" href="../api/map?baixar=1" download="map.json" title="Baixa o mapa do servidor (pra guardar no git)">Baixar</a>
        </div>
      </div>
      <button class="export-btn" id="saveBtn" title="Salva o mapa no servidor (Ctrl+S)">Salvar</button>
    </div>
    </div>

    <div class="canvas-wrap">
      <div class="board">
        <div class="view">
          <canvas id="canvas"></canvas>
          <canvas id="overlay"></canvas>
        </div>
      </div>
    </div>

    <div class="statusbar" id="statusbar" hidden>
      <span>Editando <b id="layerLabel">Andar 0</b></span>
      <div class="status-list">
        <div>Piso: <b id="statFloor">0</b></div>
        <div>Borda: <b id="statBorder">0</b></div>
        <div>Parede: <b id="statWall">0</b></div>
        <div>Escada: <b id="statStairs">0</b></div>
        <div>Buraco: <b id="statHole">0</b></div>
        <div>Item: <b id="statItem">0</b></div>
        <div>Criatura: <b id="statCreature">0</b></div>
        <div>Zona segura: <b id="statSafe">0</b></div>
      </div>
    </div>
  </div>

</div>

<div class="float-panel" id="enemyForm">
  <div class="field">
    <label id="enemyName">Criatura</label>
  </div>
  <div class="row">
    <div class="field">
      <label>Level</label>
      <input type="number" id="enemyLvl" value="5" min="1" />
    </div>
  </div>
  <div class="actions">
    <button id="enemyCancel">Cancelar</button>
    <button class="primary" id="enemyConfirm">Colocar criatura</button>
  </div>
</div>


<div class="float-panel wide" id="selectPanel">
  <div class="field">
    <label id="selectTitle">Sqm</label>
  </div>
  <div id="selectList" class="select-list"></div>
  <div class="actions">
    <button id="selectClose">Fechar</button>
  </div>
</div>

<div class="float-panel wide" id="objectDataForm">
  <div class="field">
    <label id="objectDataTitle">Objeto</label>
  </div>
  <div class="field" id="objectDataTextField">
    <label for="objectDataText">Texto</label>
    <textarea id="objectDataText" rows="6" maxlength="2000"></textarea>
  </div>
  <div class="field" id="objectDataColorField">
    <label for="objectDataColor">Cor da mensagem</label>
    <select id="objectDataColor">
      <option value="info">Verde</option>
      <option value="warn">Amarelo</option>
      <option value="danger">Vermelho</option>
      <option value="blue">Azul</option>
    </select>
  </div>
  <div class="field" id="objectDataItemsField">
    <label id="objectDataItemsLabel">Itens do baú (cada player pega uma vez)</label>
    <div id="objectDataItems" class="object-data-items"></div>
    <button type="button" id="objectDataAddItem">+ Item</button>
  </div>
  <div class="field" id="objectDataDestField">
    <label>Destino (x, y e andar)</label>
    <div class="row">
      <input type="number" id="objectDataDestX" placeholder="x" title="x">
      <input type="number" id="objectDataDestY" placeholder="y" title="y">
      <input type="number" id="objectDataDestZ" placeholder="andar" title="andar">
    </div>
  </div>
  <div class="field" id="objectDataDoorField">
    <label>Regras da porta (vazio = sem a regra)</label>
    <div class="row">
      <input type="number" id="objectDataDoorKey" min="1" placeholder="nº da chave" title="Número da chave: a porta começa trancada">
      <input type="number" id="objectDataDoorLevel" min="1" placeholder="nível" title="Nível mínimo pra abrir">
      <input type="text" id="objectDataDoorQuest" maxlength="60" placeholder="quest" title="Só abre pra quem já fez essa quest (o código do baú de quest)">
    </div>
  </div>
  <div class="field" id="objectDataKeyField">
    <label for="objectDataKeyNumber">Número da chave (abre a porta com o mesmo número)</label>
    <input type="number" id="objectDataKeyNumber" min="1">
  </div>
  <div class="field" id="objectDataTargetsField">
    <label>Alvos da alavanca (x, y e andar de portas ou objetos)</label>
    <div id="objectDataTargets" class="object-data-items"></div>
    <button type="button" id="objectDataAddTarget">+ Alvo</button>
  </div>
  <div class="actions">
    <button id="objectDataCancel">Cancelar</button>
    <button class="primary" id="objectDataConfirm">Salvar</button>
  </div>
</div>

<script type="module" src="js/controller/app.js"></script>

</body>
</html>
