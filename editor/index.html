<!-- index.html -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Editor de Estrutura — 25x25</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <div class="sidebar">
    <div class="brand">
      <div class="dot"></div>
      <h1>Editor de Estrutura</h1>
    </div>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:-10px;">grade 25×25 · sprites do servidor</span>

    <div>
      <div class="section-label">Andar</div>
      <div class="layer-tabs" id="layerTabs"></div>
    </div>

    <div>
      <div class="section-label">Ferramenta</div>
      <div class="tools" id="tools"></div>
    </div>

    <label class="checkline">
      <input type="checkbox" id="ghostToggle" checked />
      Mostrar andar abaixo (fantasma)
    </label>

    <button class="danger-btn" id="clearLayerBtn">Limpar andar atual</button>
    <button class="export-btn" id="saveBtn" title="Salva em data/map.json (Ctrl+S)">Salvar</button>
  </div>

  <div class="main">
    <div class="topbar">
      <h2>Editando <b id="layerLabel">Andar 0</b></h2>
      <div class="status-list">
        <div>Piso: <b id="statFloor">0</b></div>
        <div>Parede: <b id="statWall">0</b></div>
        <div>Escada: <b id="statStairs">0</b></div>
        <div>Buraco: <b id="statHole">0</b></div>
        <div>Item: <b id="statItem">0</b></div>
        <div>Criatura: <b id="statCreature">0</b></div>
        <div>Zona segura: <b id="statSafe">0</b></div>
      </div>
      <div class="border-toggle" id="borderToggle">
        <div class="led"></div>
        <span>Exibir bordas</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <div class="board">
        <canvas id="canvas" width="800" height="800"></canvas>
      </div>
    </div>
  </div>

  <aside class="tibia-panel">
    <div class="tibia-head">
      <div class="section-label">Sprites Tibia 7.8</div>
      <span class="tibia-count" id="tibiaCount"></span>
    </div>
    <div class="tibia-tabs" id="tibiaTabs"></div>
    <div class="tibia-filters">
      <input type="search" id="tibiaSearch" placeholder="Buscar pelo número" inputmode="numeric" autocomplete="off" />
      <label class="checkline">
        <input type="checkbox" id="tibiaOnlyReady" />
        Só os já gerados
      </label>
    </div>
    <p class="tibia-status" id="tibiaStatus" hidden></p>
    <form class="tibia-creature-form" id="tibiaCreatureForm" autocomplete="off" hidden>
      <b id="tibiaCreatureTitle">Criatura</b>
      <div class="field">
        <label for="tibiaCreatureName">Nome</label>
        <input type="text" id="tibiaCreatureName" maxlength="30" placeholder="Ex.: Rat" required />
      </div>
      <div class="row">
        <div class="field">
          <label for="tibiaCreatureLvl">Level padrão</label>
          <input type="number" id="tibiaCreatureLvl" min="1" value="5" />
        </div>
        <div class="field">
          <label for="tibiaCreatureCorpse">Cadáver (nº item)</label>
          <input type="text" id="tibiaCreatureCorpse" inputmode="numeric" placeholder="opcional" />
        </div>
      </div>
      <div class="actions">
        <button type="button" id="tibiaCreatureCancel">Cancelar</button>
        <button type="submit" class="primary">Gerar criatura</button>
      </div>
    </form>
    <div class="tibia-grid" id="tibiaGrid"></div>
  </aside>

</div>

<div class="float-panel" id="enemyForm">
  <div class="row">
    <div class="field">
      <label>Tipo</label>
      <select id="enemyType"></select>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>Level</label>
      <input type="number" id="enemyLvl" value="5" min="1" />
    </div>
  </div>
  <div class="actions">
    <button id="enemyCancel">Cancelar</button>
    <button class="primary" id="enemyConfirm">Colocar criatura</button>
  </div>
</div>


<script type="module" src="js/controller/app.js"></script>

</body>
</html>
