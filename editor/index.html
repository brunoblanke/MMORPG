<!-- index.html -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Editor de Estrutura — 25x25</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <div class="sidebar">
    <div class="brand">
      <div class="dot"></div>
      <h1>Editor de Estrutura</h1>
    </div>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:-10px;">grade 25×25 · sprites do servidor</span>

    <div>
      <div class="section-label">Andar</div>
      <div class="layer-tabs" id="layerTabs"></div>
    </div>

    <div>
      <div class="section-label">Ferramenta</div>
      <div class="tools" id="tools"></div>
    </div>

    <label class="checkline">
      <input type="checkbox" id="ghostToggle" checked />
      Mostrar andar abaixo (fantasma)
    </label>

    <button class="danger-btn" id="rebuildBordersBtn" title="Gera de novo todas as bordas do andar pelos pisos (desfaz o que foi mexido à mão)">Refazer bordas do andar</button>
    <button class="danger-btn" id="clearLayerBtn">Limpar andar atual</button>
    <button class="export-btn" id="saveBtn" title="Salva em data/map.json (Ctrl+S)">Salvar</button>
  </div>

  <div class="main">
    <div class="topbar">
      <h2>Editando <b id="layerLabel">Andar 0</b></h2>
      <div class="status-list">
        <div>Piso: <b id="statFloor">0</b></div>
        <div>Borda: <b id="statBorder">0</b></div>
        <div>Parede: <b id="statWall">0</b></div>
        <div>Escada: <b id="statStairs">0</b></div>
        <div>Buraco: <b id="statHole">0</b></div>
        <div>Item: <b id="statItem">0</b></div>
        <div>Criatura: <b id="statCreature">0</b></div>
        <div>Zona segura: <b id="statSafe">0</b></div>
      </div>
      <div class="border-toggle on" id="borderToggle">
        <div class="led"></div>
        <span>Exibir bordas</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <div class="board">
        <canvas id="canvas" width="800" height="800"></canvas>
      </div>
    </div>
  </div>

</div>

<div class="float-panel" id="enemyForm">
  <div class="row">
    <div class="field">
      <label>Tipo</label>
      <select id="enemyType"></select>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>Level</label>
      <input type="number" id="enemyLvl" value="5" min="1" />
    </div>
  </div>
  <div class="actions">
    <button id="enemyCancel">Cancelar</button>
    <button class="primary" id="enemyConfirm">Colocar criatura</button>
  </div>
</div>


<div class="float-panel wide" id="selectPanel">
  <div class="field">
    <label id="selectTitle">Sqm</label>
  </div>
  <div id="selectList" class="select-list"></div>
  <div class="actions">
    <button id="selectClose">Fechar</button>
  </div>
</div>

<div class="float-panel wide" id="objectDataForm">
  <div class="field">
    <label id="objectDataTitle">Objeto</label>
  </div>
  <div class="field" id="objectDataTextField">
    <label for="objectDataText">Texto</label>
    <textarea id="objectDataText" rows="6" maxlength="2000"></textarea>
  </div>
  <div class="field" id="objectDataItemsField">
    <label id="objectDataItemsLabel">Itens do baú (cada player pega uma vez)</label>
    <div id="objectDataItems" class="object-data-items"></div>
    <button type="button" id="objectDataAddItem">+ Item</button>
  </div>
  <div class="actions">
    <button id="objectDataCancel">Cancelar</button>
    <button class="primary" id="objectDataConfirm">Salvar</button>
  </div>
</div>

<script type="module" src="js/controller/app.js"></script>

</body>
</html>
